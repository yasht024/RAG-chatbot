                      "on-surface": "#191c1d",
                      "tertiary-container": "#fda417",
                      "on-primary-container": "#00533c",
                      "on-tertiary-container": "#673f00",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed": "#2a1700",
                      "on-secondary-fixed": "#001c39",
                      "surface-container-high": "#e7e8e9",
                      "inverse-surface": "#2e3132",
                      "primary-container": "#00d09c",
                      "surface-tint": "#006c4f",
                      "surface-container-highest": "#e1e3e4",
                      "surface-variant": "#e1e3e4",
                      "primary-fixed-dim": "#2fe0aa",
                      "surface-dim": "#d9dadb",
                      "tertiary-fixed": "#ffddb8",
                      "tertiary": "#855300",
                      "secondary-fixed-dim": "#afc8ee",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#2fe0aa",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#f3f4f5",
                      "inverse-on-surface": "#f0f1f2",
                      "on-secondary-container": "#465f80",
                      "tertiary-fixed-dim": "#ffb95f",
                      "surface-container-lowest": "#ffffff",
                      "on-background": "#191c1d",
                      "primary": "#006c4f",
                      "surface-container": "#edeeef",
                      "secondary-fixed": "#d3e3ff",
                      "error": "#ba1a1a",
                      "on-secondary": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "primary-fixed": "#59fdc5",
                      "outline": "#6b7b72",
                      "surface-bright": "#f8f9fa",
                      "background": "#f8f9fa",
                      "secondary": "#486081",
                      "outline-variant": "#bacac1",
                      "on-primary-fixed-variant": "#00513b",
                      "on-primary-fixed": "#002116"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "16px",
                      "max-width": "1280px",
                      "unit": "4px",
                      "gutter": "24px",
                      "sm": "8px",
                      "margin": "24px",
                      "xl": "40px",
                      "lg": "24px",

              "fontFamily": {
                      "body-md": ["Inter"],

              "fontSize": {

                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]

            }
          }
        }
    </script>
    <style>
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
            fill: currentColor;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #bacac1;
            border-radius: 10px;
            border: 3px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #8ca495;
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: #465f80;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background-color: #5c7ca6;
        }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
    <div id="root" class="min-h-screen w-full flex flex-col flex-1 relative"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
